name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: backupapp-windows-x64
            ext: zip
          - os: macos-latest
            artifact: backupapp-macos-x64
            ext: zip
          - os: ubuntu-latest
            artifact: backupapp-linux-x64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: |
          pip install -e .
          pip install pyinstaller

      - name: build
        run: pyinstaller --noconfirm packaging/backupapp.spec

      - name: ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --sign - ./dist/backupapp/backupapp
          codesign --force --sign - ./dist/backupapp/backupapp-cli

      - name: smoke test (frozen binary)
        shell: bash
        run: |
          ./dist/backupapp/backupapp-cli --version
          ./dist/backupapp/backupapp-cli import tests/fixtures/ci_app.json
          ./dist/backupapp/backupapp-cli script --app ci --plan-id cfg --kind backup --flavor sh | head -n 3

      - name: package
        shell: bash
        run: |
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -Command "Compress-Archive -Path backupapp -DestinationPath ../${{ matrix.artifact }}.${{ matrix.ext }}"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            zip -qry ../${{ matrix.artifact }}.${{ matrix.ext }} backupapp
          else
            tar -czf ../${{ matrix.artifact }}.${{ matrix.ext }} backupapp
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.${{ matrix.ext }}

  # macOS 开发者签名 + 公证（可选）：配置以下 secrets 后自动生效
  #   MACOS_CERT_P12        - 开发者证书 .p12 的 base64
  #   MACOS_CERT_PASSWORD   - .p12 密码
  #   CODESIGN_IDENTITY     - 证书名称，如 "Developer ID Application: X (TEAMID)"
  #   APPLE_ID              - Apple 账号邮箱
  #   APPLE_TEAM_ID         - 团队 ID
  #   APPLE_APP_PASSWORD    - Apple ID 专用 app 密码
  notarize:
    if: startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID != '' && secrets.MACOS_CERT_P12 != ''
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: import certificate + sign + notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -e
          cd dist/backupapp-macos-x64
          rm -rf backupapp && unzip -q backupapp-macos-x64.zip
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          codesign --force --options runtime --sign "$CODESIGN_IDENTITY" backupapp/backupapp
          codesign --force --options runtime --sign "$CODESIGN_IDENTITY" backupapp/backupapp-cli
          xcrun notarytool submit backupapp/backupapp \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple backupapp/backupapp
          zip -qry ../backupapp-macos-x64-signed.zip backupapp
      - name: release (signed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/backupapp-macos-x64/../backupapp-macos-x64-signed.zip
          append_body: true
