name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: backupapp-windows-x64
            ext: zip
          # macos-13 已于 2025-12-04 退役，Intel 构建改用 macos-15-intel
          #（该镜像也将于 2027 秋 macOS 15 退役后终止，届时需评估是否放弃 x64 包）
          - os: macos-15-intel
            artifact: backupapp-macos-x64
            ext: zip
          - os: macos-latest
            artifact: backupapp-macos-arm64
            ext: zip
          - os: ubuntu-latest
            artifact: backupapp-linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            artifact: backupapp-linux-arm64
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: |
          pip install -e .
          pip install pyinstaller

      - name: build
        run: pyinstaller --noconfirm packaging/backupapp.spec

      - name: ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --force --sign - ./dist/backupapp/backupapp
          codesign --force --sign - ./dist/backupapp/backupapp-cli

      - name: smoke test (frozen binary)
        shell: bash
        run: |
          ./dist/backupapp/backupapp-cli --version
          ./dist/backupapp/backupapp-cli import tests/fixtures/ci_app.json
          ./dist/backupapp/backupapp-cli script --app ci --plan-id cfg --flavor sh | head -n 3

      - name: package
        shell: bash
        run: |
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -Command "Compress-Archive -Path backupapp -DestinationPath ../${{ matrix.artifact }}.${{ matrix.ext }}"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            zip -qry ../${{ matrix.artifact }}.${{ matrix.ext }} backupapp
          else
            tar -czf ../${{ matrix.artifact }}.${{ matrix.ext }} backupapp
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}
          if-no-files-found: error

      # Release 正文：从 CHANGELOG / CHANGELOG.en.md 提取当前 tag 版本段，拼成中英双语
      - name: build bilingual release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          ver = os.environ["RELEASE_TAG"]
          def block(text):
              lines = text.splitlines()
              start = next((i for i, l in enumerate(lines)
                            if re.match(rf"^## {re.escape(ver)}[\s(（]", l)), None)
              if start is None:
                  return ""
              end = next((j for j in range(start + 1, len(lines))
                          if re.match(r"^## v\d", lines[j])), len(lines))
              return "\n".join(lines[start + 1:end]).strip()
          zh = block(pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8"))
          en = block(pathlib.Path("CHANGELOG.en.md").read_text(encoding="utf-8"))
          if not zh or not en:
              raise SystemExit(f"CHANGELOG has no entry for {ver} (zh={len(zh)}, en={len(en)})")
          body = "## 更新日志（简体中文）\n\n" + zh + \
              "\n\n---\n\n## Changelog (English)\n\n" + en
          pathlib.Path("release-notes.md").write_text(body, encoding="utf-8")
          PY

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}.${{ matrix.ext }}
          body_path: release-notes.md

  # macOS 开发者签名 + 公证（可选）：配置以下 secrets 后自动生效
  #   MACOS_CERT_P12        - 开发者证书 .p12 的 base64
  #   MACOS_CERT_PASSWORD   - .p12 密码
  #   CODESIGN_IDENTITY     - 证书名称，如 "Developer ID Application: X (TEAMID)"
  #   APPLE_ID              - Apple 账号邮箱
  #   APPLE_TEAM_ID         - 团队 ID
  #   APPLE_APP_PASSWORD    - Apple ID 专用 app 密码
  notarize:
    # secrets context 不能用于 if 表达式，改在 job 内用 env 检查
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-latest
    steps:
      - name: check signing secrets
        id: check
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [[ -n "${APPLE_ID:-}" && -n "${MACOS_CERT_P12:-}" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: import certificate + sign + notarize
        if: steps.check.outputs.ok == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          set -e
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain
          for dir in dist/backupapp-macos-*/; do
            name=$(basename "$dir")
            (
              cd "$dir"
              rm -rf backupapp && unzip -q "$name.zip"
              codesign --force --options runtime --sign "$CODESIGN_IDENTITY" backupapp/backupapp
              codesign --force --options runtime --sign "$CODESIGN_IDENTITY" backupapp/backupapp-cli
              xcrun notarytool submit backupapp/backupapp \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" \
                --wait
              xcrun stapler staple backupapp/backupapp
              zip -qry "../$name-signed.zip" backupapp
            )
          done
      - name: release (signed)
        if: steps.check.outputs.ok == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/backupapp-macos-*-signed.zip
          append_body: true
